<header
  class="flex justify-between items-center w-full px-6 py-4 sticky top-0 z-50 bg-[#f8f9fa] dark:bg-[#191c1d] border-b border-outline-variant/10 shadow-sm dark:shadow-none"
>
  <div class="flex items-center gap-4">
    <a
      routerLink="/"
      class="text-xl font-bold tracking-tight text-[#b61722] dark:text-[#da3437] hover:opacity-90 transition-opacity"
      >Quenhé</a
    >
  </div>

  <nav class="hidden sm:flex items-center gap-6" aria-label="Navegação principal">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="text-primary font-semibold"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        class="text-sm text-on-surface-variant hover:text-primary transition-colors py-1"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="flex items-center gap-2">
    <a
      routerLink="/login"
      class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-1 rounded-full hover:bg-surface-container-low"
      aria-label="Acessar Perfil"
    >
      <span class="material-symbols-outlined text-2xl">account_circle</span>
    </a>
  </div>
</header>
