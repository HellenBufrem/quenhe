<header class="navbar border-base-300 bg-base-100 border-b px-4">
  <div class="flex-1 gap-2">
    <a routerLink="/" class="text-primary text-xl font-bold tracking-tight">Quenhé</a>
  </div>

  <nav class="hidden flex-none lg:block" aria-label="Navegação principal">
    <ul class="menu menu-horizontal gap-1 px-1">
      @for (item of navItems; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/' }">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="flex-none lg:hidden">
    <label
      [attr.for]="drawerId"
      class="btn btn-square btn-ghost text-lg"
      aria-label="Abrir menu"
    >
      ☰
    </label>
  </div>
</header>
