<header class="navbar bg-[#f8f9fa] border-b border-outline-variant/10 shadow-sm sticky top-0 z-50 px-6 py-4">
  <!-- Navbar Start: Burger menu + Brand logo -->
  <div class="navbar-start gap-2">
    <!-- Menu Hambúrguer (dropdown) - aparece apenas em telas menores que lg -->
    <div class="dropdown lg:hidden">
      <div tabindex="0" role="button" class="btn btn-ghost btn-circle text-on-surface hover:bg-surface-container-low" aria-label="Menu principal">
        <span class="material-symbols-outlined text-2xl">menu</span>
      </div>
      <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-50 p-2 shadow bg-[#f8f9fa] border border-outline-variant/10 rounded-box w-52 gap-1">
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="text-primary font-semibold bg-primary/10"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              class="text-sm text-on-surface-variant hover:text-primary py-2"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </div>
    
    <!-- Logo -->
    <a
      routerLink="/"
      class="text-xl font-bold tracking-tight text-primary hover:opacity-90 transition-opacity"
      >Quenhé</a
    >
  </div>

  <!-- Navbar Center: Desktop Menu - aparece apenas em telas lg ou maiores -->
  <div class="navbar-center hidden lg:flex">
    <nav class="flex items-center gap-6" aria-label="Navegação principal">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="text-primary font-semibold"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="text-sm text-on-surface-variant hover:text-primary transition-colors py-1"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </div>

  <!-- Navbar End: Profile link -->
  <div class="navbar-end">
    <a
      routerLink="/login"
      class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low"
      aria-label="Acessar Perfil"
    >
      <span class="material-symbols-outlined text-2xl">account_circle</span>
    </a>
  </div>
</header>
