<main class="max-w-md mx-auto px-6 py-8 space-y-8">
  <!-- Hero Editorial Section -->
  <section class="space-y-2">
    <h2 class="text-display-sm font-extrabold tracking-tight text-on-surface leading-tight">
      Crie memórias <br /><span class="text-primary">neste natal.</span>
    </h2>
    <p class="text-body-md text-on-surface-variant opacity-80 leading-relaxed">
      Organize seu sorteio de forma elegante, rápida e sem complicações.
    </p>
  </section>

  <!-- Card 1: Criar Novo Grupo -->
  <div class="relative group">
    <div
      class="absolute -inset-0.5 bg-gradient-to-br from-primary to-primary-container rounded-[1.5rem] blur opacity-5 group-hover:opacity-10 transition duration-500">
    </div>
  </div>
  <section
    class="relative bg-surface-container-lowest p-8 rounded-xl shadow-[0_24px_40px_rgba(25,28,29,0.04)] overflow-hidden">
    <div class="absolute top-0 right-0 -mr-4 -mt-4 w-24 h-24 bg-primary/5 rounded-full blur-2xl"></div>
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
        <span class="material-symbols-outlined">add_circle</span>
      </div>
      <h3 class="text-headline-md font-bold text-on-surface">Criar Novo Grupo</h3>
    </div>
    <form class="space-y-6" (ngSubmit)="iniciarGrupo()">
      <div class="space-y-1.5">
        <label class="text-[11px] font-semibold uppercase tracking-[0.05em] text-on-surface-variant/70 ml-1">Nome do
          Evento</label>
        <input name="nomeEvento" [(ngModel)]="nomeEvento"
          class="w-full px-4 py-4 bg-surface-container-highest rounded-lg border-none focus:ring-2 focus:ring-primary/40 text-on-surface placeholder:text-on-surface-variant/40 transition-all"
          placeholder="Ex: Natal da Família Silva" type="text" />
      </div>
      <button (click)="iniciarGrupo()"
        class="w-full py-4 px-6 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-lg shadow-lg shadow-primary/20 active:scale-95 transition-all flex items-center justify-center gap-2"
        type="submit">
        <span>Iniciar Grupo</span>
        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
      </button>
    </form>
  </section>
  </div>

  <!-- Card 2: Entrar com Código -->
  <section
    class="bg-surface-container-lowest p-8 rounded-xl shadow-[0_24px_40px_rgba(25,28,29,0.04)] border border-outline-variant/10">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-full bg-secondary/10 flex items-center justify-center text-secondary">
        <span class="material-symbols-outlined">key</span>
      </div>
      <h3 class="text-headline-md font-bold text-on-surface">Entrar com Código</h3>
    </div>
    <form class="space-y-6" (ngSubmit)="acessarGrupo()">
      <div class="space-y-1.5">
        <label class="text-[11px] font-semibold uppercase tracking-[0.05em] text-on-surface-variant/70 ml-1">Código do
          Convite</label>
        <input name="codigoConvite" [(ngModel)]="codigoConvite"
          class="w-full px-4 py-4 bg-surface-container-highest rounded-lg border-none focus:ring-2 focus:ring-secondary/40 text-on-surface placeholder:text-on-surface-variant/40 transition-all font-mono tracking-widest"
          placeholder="Ex: ABC-123-XYZ" type="text" />
      </div>
      <button (click)="acessarGrupo()"
        class="w-full py-4 px-6 bg-secondary text-on-secondary font-bold rounded-lg shadow-lg shadow-secondary/20 active:scale-95 transition-all flex items-center justify-center gap-2"
        type="submit">
        <span>Acessar Grupo</span>
        <span class="material-symbols-outlined text-[20px]">group</span>
      </button>
    </form>
  </section>

  <!-- Illustration / Decor -->
  <div class="pt-4 flex justify-center">
    <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-surface-container-low">
      <img alt="Holiday celebration" class="w-full h-full object-cover opacity-60 mix-blend-multiply"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYsp1muM02kDyfYBKHjN0SWIW8QWZYdJk2wx4hWuN4J86jQ24UnPSS7mb2yW1cC-X5M5_mzpna6SgBqihkbjslVIG-_GxxwHuONMMwIWm-cyzel4Z6NRJ4MDv2eu19Kgx5gkl1QWQIJDeqsIhwSjJp81LMAd5qGPp2Uk57GPqrPl4JQoUBw5-hqi-DVQiyafc8bPCOv6HZTV7yvorpDIheTm4Kld-mmw1BQGfMyqFCR-Ef24dhabKAbCL32alkuaslJ4BKsNGSlkIO" />
      <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low via-transparent to-transparent"></div>
    </div>
  </div>
</main>
